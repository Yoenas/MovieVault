name: movie_vault
description: "Movie Vault – your ultimate destination for discovering and exploring your favorite movies and TV shows!"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.2
  cached_network_image: ^4.0.0
  http: ^1.2.2
  flutter_riverpod: ^3.4.3
  uuid: ^4.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  path: ^1.9.0
  sqflite: ^2.4.2
  mask_text_input_formatter: ^2.9.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_database: ^12.6.0
  firebase_storage: ^13.6.0
  riverpod_annotation: ^4.0.7
  envied: ^1.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9
  envied_generator: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/svg/auth/
    - assets/svg/bottom_nav/
